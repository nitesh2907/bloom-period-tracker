name: Build APK and publish release

# Run it from the "Actions" tab (Run workflow), or it runs by itself
# when you push a change to the "version" in app.json.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [app.json]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        # 64-bit phones only + code/resource shrinking keeps the APK small
        run: >
          ./gradlew assembleRelease --no-daemon
          -PreactNativeArchitectures=arm64-v8a
          -Pandroid.enableMinifyInReleaseBuilds=true
          -Pandroid.enableShrinkResourcesInReleaseBuilds=true

      - name: Read app version
        id: ver
        run: echo "version=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk bloom.apk

      - name: Put APK on the website (Cloudflare allows files up to 25 MB)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 - <<'PYEOF'
          import json, os
          v = os.environ["VERSION"]
          size = os.path.getsize("bloom.apk")
          mb = round(size / 1048576, 1)
          print("APK size:", mb, "MB")
          data = json.load(open("docs/version.json"))
          data["latestVersion"] = v
          data["apkSizeMB"] = mb
          release = "https://github.com/nitesh2907/bloom-period-tracker/releases/latest/download/bloom.apk"
          if size < 24.5 * 1048576:
              import shutil
              shutil.copy("bloom.apk", "docs/bloom.apk")
              data["apkUrl"] = "bloom.apk?v=" + v
              data["androidUrl"] = "https://bloom-period-tracker.pages.dev/bloom.apk?v=" + v
          else:
              data["apkUrl"] = release
              data["androidUrl"] = release
          json.dump(data, open("docs/version.json", "w"), indent=2)
          PYEOF
          cp docs/version.json version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs version.json
          git commit -m "Website: Bloom APK v$VERSION" || echo "nothing to commit"
          git push

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Bloom v${{ steps.ver.outputs.version }}
          body: |
            Download **bloom.apk** below and open it on your Android phone to install.
          files: bloom.apk
          make_latest: true
          overwrite_files: true
